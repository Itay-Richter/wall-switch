<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מפסק חכם</title>
  <!-- "Add to Home Screen": icon, name, and open full-screen like an app -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מפסק">
  <meta name="theme-color" content="#f5b301">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #e3e6eb;
      --on: #f5b301;
      --on-text: #3a2a00;
      --off: #3b4252;
      --off-text: #ffffff;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1c2028;
        --text: #e8eaee;
        --muted: #9aa3b2;
        --border: #2c323d;
        --off: #4b5565;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    main { width: 100%; max-width: 420px; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; }
    .pill {
      font-size: 0.85rem; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .pill::before { content: "●"; margin-left: 6px; }
    .pill.ok::before { color: var(--ok); }
    .pill.connecting::before { color: var(--warn); }
    .pill.bad::before { color: var(--bad); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .state {
      text-align: center; font-size: 1.4rem; font-weight: 600;
      padding: 28px 0; margin-bottom: 20px; border-radius: 12px;
      background: var(--bg);
    }
    .state.on { background: var(--on); color: var(--on-text); }
    .state.off { background: var(--off); color: var(--off-text); }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      font: inherit; border: none; border-radius: 12px; cursor: pointer;
      padding: 18px 0; font-size: 1.15rem; font-weight: 600;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    .btn-on { background: var(--on); color: var(--on-text); }
    .btn-off { background: var(--off); color: var(--off-text); }
    .btn-main { width: 100%; background: var(--text); color: var(--card); margin-top: 8px; }
    .link {
      background: none; color: var(--muted); font-size: 0.9rem; font-weight: 400;
      padding: 8px; margin-top: 16px; width: 100%;
    }
    .msg { min-height: 1.4em; text-align: center; color: var(--muted); margin: 14px 0 0; }
    .error { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; }
    label { display: block; margin-bottom: 14px; font-size: 0.95rem; }
    input[type=text], input[type=password] {
      display: block; width: 100%; margin-top: 6px; padding: 12px;
      font: inherit; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    .row { display: flex; align-items: center; gap: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>מנורה</h1>
      <span id="conn" class="pill bad">לא מחובר</span>
    </header>

    <!-- Login: the password is typed here, never written in the code -->
    <section id="login" class="card" hidden>
      <form id="loginForm">
        <label>שם משתמש
          <input id="user" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>סיסמה
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <label class="row">
          <input id="remember" type="checkbox" checked> לזכור במכשיר הזה
        </label>
        <button type="submit" class="btn-main">התחבר</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <!-- Control -->
    <section id="control" class="card" hidden>
      <div id="state" class="state">מצב לא ידוע</div>
      <div class="buttons">
        <button id="btnOn" class="btn-on" disabled>הדלק</button>
        <button id="btnOff" class="btn-off" disabled>כבה</button>
      </div>
      <p id="msg" class="msg"></p>
      <button id="logout" class="link">התנתק</button>
    </section>
  </main>

  <!-- MQTT.js: lets the browser talk MQTT over a WebSocket -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const BROKER_URL    = "wss://g1877f21.ala.asia-southeast1.emqxsl.com:8084/mqtt";
    const TOPIC_COMMAND = "home/lamp/command";
    const TOPIC_STATE   = "home/lamp/state";
    const STORAGE_KEY   = "wallSwitchLogin";
    const REPLY_TIMEOUT_MS = 5000;

    const $ = (id) => document.getElementById(id);
    let client = null;
    let replyTimer = null;

    // ---- saved login (only on this device) ----
    function loadLogin() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    }
    function saveLogin(login) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(login)); } catch {}
    }
    function clearLogin() {
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
    }

    // ---- screen helpers ----
    function show(section) {
      $("login").hidden = section !== "login";
      $("control").hidden = section !== "control";
    }
    function setConn(text, kind) {
      $("conn").textContent = text;
      $("conn").className = "pill " + kind;
      const ready = kind === "ok";
      $("btnOn").disabled = !ready;
      $("btnOff").disabled = !ready;
    }
    function showState(state) {
      const el = $("state");
      if (state === "on") { el.textContent = "דולק"; el.className = "state on"; }
      else if (state === "off") { el.textContent = "כבוי"; el.className = "state off"; }
      else { el.textContent = "מצב לא ידוע"; el.className = "state"; }
    }

    // ---- MQTT ----
    function connect(login, remember) {
      setConn("מתחבר...", "connecting");
      show("control");

      client = mqtt.connect(BROKER_URL, {
        username: login.user,
        password: login.pass,
        clientId: "web-" + Math.random().toString(16).slice(2, 10),  // unique per visit
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 10000,
      });

      client.on("connect", () => {
        if (remember) saveLogin(login);
        setConn("מחובר", "ok");
        client.subscribe(TOPIC_STATE);  // retained message arrives right away
      });

      client.on("message", (topic, payload) => {
        if (topic !== TOPIC_STATE) return;
        clearTimeout(replyTimer);
        $("msg").textContent = "";
        showState(payload.toString().trim());
      });

      client.on("reconnect", () => setConn("מתחבר מחדש...", "connecting"));
      client.on("offline", () => setConn("אין חיבור", "bad"));

      client.on("error", (err) => {
        // 4/5 (MQTT 3.1.1) = bad username/password or not authorized
        if (err && [4, 5, 134, 135].includes(err.code)) {
          client.end(true);
          client = null;
          clearLogin();
          setConn("לא מחובר", "bad");
          show("login");
          $("loginError").textContent = "שם משתמש או סיסמה שגויים";
        }
      });
    }

    function send(command) {
      if (!client || !client.connected) return;
      client.publish(TOPIC_COMMAND, command);
      $("msg").textContent = "שולח...";
      clearTimeout(replyTimer);
      replyTimer = setTimeout(() => {
        $("msg").textContent = "המכשיר לא ענה. ייתכן שהוא כבוי או לא מחובר.";
      }, REPLY_TIMEOUT_MS);
    }

    // ---- events ----
    $("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      const login = { user: $("user").value.trim(), pass: $("pass").value };
      connect(login, $("remember").checked);
    });
    $("btnOn").addEventListener("click", () => send("on"));
    $("btnOff").addEventListener("click", () => send("off"));
    $("logout").addEventListener("click", () => {
      if (client) client.end(true);
      client = null;
      clearLogin();
      showState(null);
      setConn("לא מחובר", "bad");
      show("login");
    });

    // ---- start ----
    const saved = loadLogin();
    if (saved) connect(saved, true);
    else show("login");
  </script>
</body>
</html>
