<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מפסק חכם</title>
  <!-- "Add to Home Screen": icon, name, and open full-screen like an app -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מפסק">
  <meta name="theme-color" content="#f5b301">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #e3e6eb;
      --on: #f5b301;
      --on-text: #3a2a00;
      --off: #3b4252;
      --off-text: #ffffff;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1c2028;
        --text: #e8eaee;
        --muted: #9aa3b2;
        --border: #2c323d;
        --off: #4b5565;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    main { width: 100%; max-width: 420px; padding: 24px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; }
    .pill {
      font-size: 0.85rem; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .pill::before { content: "●"; margin-left: 6px; }
    .pill.ok::before { color: var(--ok); }
    .pill.connecting::before { color: var(--warn); }
    .pill.bad::before { color: var(--bad); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .state {
      text-align: center; font-size: 1.4rem; font-weight: 600;
      padding: 28px 0; margin-bottom: 20px; border-radius: 12px;
      background: var(--bg);
    }
    .state.on { background: var(--on); color: var(--on-text); }
    .state.off { background: var(--off); color: var(--off-text); }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      font: inherit; border: none; border-radius: 12px; cursor: pointer;
      padding: 18px 0; font-size: 1.15rem; font-weight: 600;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    .btn-on { background: var(--on); color: var(--on-text); }
    .btn-off { background: var(--off); color: var(--off-text); }
    .btn-main { width: 100%; background: var(--text); color: var(--card); margin-top: 8px; }
    .link {
      background: none; color: var(--muted); font-size: 0.9rem; font-weight: 400;
      padding: 8px; margin-top: 16px; width: 100%;
    }
    .msg { min-height: 1.4em; text-align: center; color: var(--muted); margin: 14px 0 0; }
    .error { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; }
    label { display: block; margin-bottom: 14px; font-size: 0.95rem; }
    input[type=text], input[type=password] {
      display: block; width: 100%; margin-top: 6px; padding: 12px;
      font: inherit; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    .row { display: flex; align-items: center; gap: 8px; }
    #updates { margin-top: 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .kv { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
    .kv b { color: var(--text); }
    #control .kv { margin-bottom: 12px; }
    .countdown { text-align: center; font-size: 1.1rem; margin: -8px 0 16px; font-variant-numeric: tabular-nums; }
    .durations { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .durations button {
      padding: 10px 0; font-size: 0.95rem; font-weight: 500;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
    }
    .durations button.selected { background: var(--on); color: var(--on-text); border-color: var(--on); }
    .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 6px 0 14px; }
    .dev-online { color: var(--ok) !important; }
    .dev-offline { color: var(--bad) !important; }
    .dev-sleep { color: var(--muted) !important; }
    .msg.bad { color: var(--bad); }
    .msg.good { color: var(--ok); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>מנורה</h1>
      <span id="conn" class="pill bad">לא מחובר</span>
    </header>

    <!-- Login: the password is typed here, never written in the code -->
    <section id="login" class="card" hidden>
      <form id="loginForm">
        <label>שם משתמש
          <input id="user" type="text" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>סיסמה
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <label class="row">
          <input id="remember" type="checkbox" checked> לזכור במכשיר הזה
        </label>
        <button type="submit" class="btn-main">התחבר</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <!-- Control -->
    <section id="control" class="card" hidden>
      <div class="kv"><span>המכשיר</span><b id="devStatus">לא ידוע</b></div>
      <div class="kv"><span>נראה לאחרונה</span><b id="devSeen">—</b></div>
      <div id="state" class="state">מצב לא ידוע</div>
      <p id="countdown" class="countdown" hidden></p>
      <div class="durations" id="durations">
        <button data-min="15">15</button>
        <button data-min="30">30</button>
        <button data-min="45">45</button>
        <button data-min="60">60</button>
        <button data-min="90">90</button>
        <button data-min="120" class="selected">120</button>
      </div>
      <p class="hint">דקות עד כיבוי אוטומטי</p>
      <div class="buttons">
        <button id="btnOn" class="btn-on" disabled>הדלק</button>
        <button id="btnOff" class="btn-off" disabled>כבה</button>
      </div>
      <p id="msg" class="msg"></p>
      <button id="btnAwake" class="link">השאר ער 10 דקות (פקודות מיידיות)</button>
    </section>

    <!-- Software update -->
    <section id="updates" class="card" hidden>
      <h2>עדכון תוכנה</h2>
      <div class="kv"><span>גרסה במכשיר</span><b id="devVersion">—</b></div>
      <div class="kv"><span>גרסה זמינה</span><b id="newVersion">—</b></div>
      <div class="kv"><span>הפעלה אחרונה</span><b id="bootReason">—</b></div>
      <button id="btnUpdate" class="btn-main" disabled>עדכן</button>
      <p id="updateMsg" class="msg"></p>
      <button id="logout" class="link">התנתק</button>
    </section>
  </main>

  <!-- MQTT.js: lets the browser talk MQTT over a WebSocket -->
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const BROKER_URL    = "wss://g1877f21.ala.asia-southeast1.emqxsl.com:8084/mqtt";
    const TOPIC_COMMAND = "home/lamp/command";
    const TOPIC_STATE   = "home/lamp/state";
    const TOPIC_VERSION = "home/lamp/version";
    const TOPIC_UPDATE  = "home/lamp/update";
    const TOPIC_STATUS  = "home/lamp/status";   // online (awake) / sleeping
    const TOPIC_BOOT    = "home/lamp/boot";     // why the device last started
    const TOPIC_TIMER   = "home/lamp/timer";    // "0" / end time (seconds) / "left:<seconds>"
    const TOPIC_SEEN    = "home/lamp/seen";     // "<epoch>,<sleep seconds>"
    const TOPIC_ACK     = "home/lamp/ack";      // id of the last command the device did
    const STORAGE_KEY   = "wallSwitchLogin";
    const CMD_LATE_S    = 5 * 60;    // not done after 5 min -> show a warning
    const CMD_MAX_AGE_S = 15 * 60;   // the device ignores older commands
    const NAMES = { on: "הדלקה", off: "כיבוי", update: "עדכון", awake: "השאר ער" };

    const $ = (id) => document.getElementById(id);
    let client = null;
    let devStatus = null;         // "online" (awake) / "sleeping"
    let seenS = 0, sleepS = 0;    // last time the device was seen + how long it sleeps
    let lastCmd = null;           // { id, cmd } - the command waiting on the broker
    let lastAck = null;           // id of the last command done
    let justDone = 0;             // to show "done" for a few seconds
    let deviceVersion = null;     // reported by the device
    let availableVersion = null;  // from firmware/version.json on this site
    let updating = false;
    let deviceOnline = null;      // null = unknown (older device code)
    let selectedMinutes = 120;
    let timerEndMs = 0;           // when the device will turn off (0 = no timer)
    let countdownTimer = null;

    // ---- heater timer ----
    function showTimer(text) {
      if (text === "0" || text === "") timerEndMs = 0;
      else if (text.startsWith("left:")) timerEndMs = Date.now() + parseInt(text.slice(5), 10) * 1000;
      else timerEndMs = parseInt(text, 10) * 1000;
      clearInterval(countdownTimer);
      tickCountdown();
      if (timerEndMs) countdownTimer = setInterval(tickCountdown, 1000);
    }
    function tickCountdown() {
      const el = $("countdown");
      const left = Math.round((timerEndMs - Date.now()) / 1000);
      if (!timerEndMs || left <= 0) {
        el.hidden = true;
        clearInterval(countdownTimer);
        return;
      }
      const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
      const two = (n) => String(n).padStart(2, "0");
      el.textContent = "ייכבה בעוד " + (h ? h + ":" + two(m) : m) + ":" + two(s);
      el.hidden = false;
    }

    // ---- saved login (only on this device) ----
    function loadLogin() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    }
    function saveLogin(login) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(login)); } catch {}
    }
    function clearLogin() {
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
    }

    // ---- screen helpers ----
    function show(section) {
      $("login").hidden = section !== "login";
      $("control").hidden = section !== "control";
      $("updates").hidden = section !== "control";
    }
    function setConn(text, kind) {
      $("conn").textContent = text;
      $("conn").className = "pill " + kind;
      refreshButtons();
    }
    function refreshButtons() {
      // The device sleeps most of the time - commands wait for it on the broker.
      const ready = client && client.connected;
      $("btnOn").disabled = !ready;
      $("btnOff").disabled = !ready;
      refreshUpdateButton();
    }
    function showDeviceStatus(text) {
      devStatus = text;
      deviceOnline = text === "online" || text === "sleeping";
      tick();
    }
    function showSeen(text) {
      const [t, sl] = text.split(",");
      seenS = parseInt(t, 10) || 0;
      sleepS = parseInt(sl, 10) || 0;
      tick();
    }
    function ago(sec) {
      if (sec < 60) return "לפני " + sec + " שניות";
      if (sec < 3600) return "לפני " + Math.round(sec / 60) + " דקות";
      return new Date(seenS * 1000).toLocaleString("he-IL", { weekday: "short", hour: "2-digit", minute: "2-digit" });
    }
    // Runs every second: device status, "last seen", and the waiting command.
    function tick() {
      const now = Date.now() / 1000;
      const el = $("devStatus");
      const nextWake = seenS + sleepS;          // when it should wake up next
      let late = false;
      if (devStatus === "online") {
        el.textContent = "ער"; el.className = "dev-online";
      } else if (devStatus === "sleeping" && seenS) {
        const left = Math.round(nextWake - now);
        late = left < -120;                      // 2 min past the expected wake-up
        if (late) { el.textContent = "לא מגיב"; el.className = "dev-offline"; }
        else { el.textContent = left > 0 ? "ישן · מתעורר בעוד " + left + " שנ׳" : "מתעורר..."; el.className = "dev-sleep"; }
      } else if (devStatus === "offline") {
        el.textContent = "לא מחובר"; el.className = "dev-offline";
      } else {
        el.textContent = "לא ידוע"; el.className = "";
      }
      $("devSeen").textContent = devStatus === "online" ? "עכשיו" : (seenS ? ago(Math.max(0, Math.round(now - seenS))) : "—");

      // The waiting command
      const m = $("msg");
      m.className = "msg";
      if (lastCmd && lastCmd.id !== lastAck) {
        const age = now - lastCmd.id / 1000;
        const name = NAMES[lastCmd.cmd.split(":")[0]] || lastCmd.cmd;
        if (age > CMD_MAX_AGE_S) {
          m.textContent = name + " – לא בוצע: המכשיר לא התעורר 15 דקות, והפקודה בוטלה.";
          m.className = "msg bad";
        } else if (age > CMD_LATE_S || late) {
          m.textContent = name + " – עוד לא בוצע. ייתכן שלמכשיר אין חשמל או אינטרנט.";
          m.className = "msg bad";
        } else if (devStatus === "online") {
          m.textContent = name + " – מבצע...";
        } else {
          const left = Math.round(nextWake - now);
          m.textContent = name + " – נשלח, יתבצע כשהמכשיר יתעורר" + (left > 0 ? " (בעוד כ־" + left + " שנ׳)" : "...");
        }
      } else if (Date.now() - justDone < 4000) {
        m.textContent = "בוצע ✓"; m.className = "msg good";
      } else if (late) {
        m.textContent = "המכשיר לא התעורר בזמן. ייתכן שאין לו חשמל או אינטרנט.";
        m.className = "msg bad";
      } else {
        m.textContent = "";
      }
    }
    setInterval(tick, 1000);
    const BOOT_TEXT = {
      "power on": "חיבור לחשמל",
      "brownout (voltage dropped)": "ירידת מתח",
      "watchdog (code was stuck)": "Watchdog – הקוד נתקע",
      "crash": "קריסה",
      "restart: after update": "אחרי עדכון",
      "restart: no Wi-Fi for 5 min": "אתחול – 5 דקות בלי Wi-Fi",
      "restart: no broker for 10 min": "אתחול – 10 דקות בלי broker",
      "restart: setup mode timed out": "אתחול – מצב הגדרה הסתיים",
      "restart: Wi-Fi reset (BOOT button)": "איפוס Wi-Fi (BOOT)",
    };

    // ---- software update ----
    function refreshUpdateButton() {
      $("devVersion").textContent = deviceVersion || "—";
      $("newVersion").textContent = availableVersion || "—";
      const connected = client && client.connected;
      const hasNew = deviceVersion && availableVersion && deviceVersion !== availableVersion;
      $("btnUpdate").disabled = !(connected && hasNew && !updating);
      if (!updating && deviceVersion && availableVersion && !hasNew) {
        $("updateMsg").textContent = "המכשיר מעודכן.";
      }
    }
    async function loadAvailableVersion() {
      try {
        const res = await fetch("firmware/version.json", { cache: "no-store" });
        availableVersion = res.ok ? (await res.json()).version : null;
      } catch { availableVersion = null; }
      refreshUpdateButton();
    }
    function showUpdateStatus(text) {
      // Messages from the device: downloading 40% / installed, restarting / failed: ... / idle
      if (text.startsWith("downloading")) {
        updating = true;
        $("updateMsg").textContent = "מוריד " + text.replace("downloading", "").trim() + "...";
      } else if (text.startsWith("installed")) {
        updating = true;
        $("updateMsg").textContent = "הותקן. המכשיר מאתחל...";
      } else if (text.startsWith("failed")) {
        updating = false;
        $("updateMsg").textContent = "העדכון נכשל, הגרסה הקודמת ממשיכה לעבוד. (" + text.replace("failed:", "").trim() + ")";
      } else if (text === "idle") {
        if (updating) $("updateMsg").textContent = "העדכון הצליח!";
        updating = false;
      }
      refreshUpdateButton();
    }
    function showState(state) {
      const el = $("state");
      if (state === "on") { el.textContent = "דולק"; el.className = "state on"; }
      else if (state === "off") { el.textContent = "כבוי"; el.className = "state off"; }
      else { el.textContent = "מצב לא ידוע"; el.className = "state"; }
    }

    // ---- MQTT ----
    function connect(login, remember) {
      setConn("מתחבר...", "connecting");
      show("control");

      client = mqtt.connect(BROKER_URL, {
        username: login.user,
        password: login.pass,
        clientId: "web-" + Math.random().toString(16).slice(2, 10),  // unique per visit
        clean: true,
        reconnectPeriod: 4000,
        connectTimeout: 10000,
      });

      client.on("connect", () => {
        if (remember) saveLogin(login);
        setConn("מחובר", "ok");
        // retained messages arrive right away
        client.subscribe([TOPIC_STATE, TOPIC_VERSION, TOPIC_UPDATE, TOPIC_STATUS, TOPIC_BOOT, TOPIC_TIMER,
                          TOPIC_SEEN, TOPIC_ACK, TOPIC_COMMAND]);
      });

      client.on("message", (topic, payload) => {
        const text = payload.toString().trim();
        if (topic === TOPIC_STATUS) { showDeviceStatus(text); return; }
        if (topic === TOPIC_SEEN) { showSeen(text); return; }
        if (topic === TOPIC_ACK) {
          if (lastCmd && text === lastCmd.id && lastAck !== text) justDone = Date.now();
          lastAck = text; tick(); return;
        }
        if (topic === TOPIC_COMMAND) {
          const bar = text.indexOf("|");
          lastCmd = bar > 0 ? { id: text.slice(0, bar), cmd: text.slice(bar + 1) } : null;
          tick(); return;
        }
        if (topic === TOPIC_TIMER) { showTimer(text); return; }
        if (topic === TOPIC_BOOT) { $("bootReason").textContent = BOOT_TEXT[text] || text; return; }
        if (topic === TOPIC_VERSION) { deviceVersion = text; refreshUpdateButton(); return; }
        if (topic === TOPIC_UPDATE) { showUpdateStatus(text); return; }
        if (topic !== TOPIC_STATE) return;
        showState(text);
      });

      client.on("reconnect", () => setConn("מתחבר מחדש...", "connecting"));
      client.on("offline", () => setConn("אין חיבור", "bad"));

      client.on("error", (err) => {
        // 4/5 (MQTT 3.1.1) = bad username/password or not authorized
        if (err && [4, 5, 134, 135].includes(err.code)) {
          client.end(true);
          client = null;
          clearLogin();
          setConn("לא מחובר", "bad");
          show("login");
          $("loginError").textContent = "שם משתמש או סיסמה שגויים";
        }
      });
    }

    // Commands wait on the broker (retained) until the device wakes up.
    // Format "<id>|<command>", id = send time in ms (the device ignores repeats and old ones).
    function send(command) {
      if (!client || !client.connected) return;
      const id = String(Date.now());
      lastCmd = { id, cmd: command };
      client.publish(TOPIC_COMMAND, id + "|" + command, { qos: 1, retain: true });
      tick();
    }

    // ---- events ----
    $("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      const login = { user: $("user").value.trim(), pass: $("pass").value };
      connect(login, $("remember").checked);
    });
    $("btnOn").addEventListener("click", () => send("on:" + selectedMinutes));
    $("durations").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-min]");
      if (!b) return;
      selectedMinutes = parseInt(b.dataset.min, 10);
      document.querySelectorAll("#durations button").forEach((x) => x.classList.toggle("selected", x === b));
    });
    $("btnOff").addEventListener("click", () => send("off"));
    $("btnUpdate").addEventListener("click", () => {
      if (!client || !client.connected) return;
      if (!confirm("לעדכן את המכשיר לגרסה " + availableVersion + "?\nהעדכון יתחיל כשהמכשיר יתעורר (עד דקה וחצי) ולוקח בערך דקה.")) return;
      updating = true;
      $("updateMsg").textContent = "בקשת העדכון נשלחה – תתחיל כשהמכשיר יתעורר.";
      refreshUpdateButton();
      send("update");
    });
    $("btnAwake").addEventListener("click", () => send("awake:10"));
    $("logout").addEventListener("click", () => {
      if (client) client.end(true);
      client = null;
      clearLogin();
      showState(null);
      setConn("לא מחובר", "bad");
      show("login");
    });

    // ---- start ----
    loadAvailableVersion();
    const saved = loadLogin();
    if (saved) connect(saved, true);
    else show("login");
  </script>
</body>
</html>
